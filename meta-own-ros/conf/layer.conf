# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-own-ros"
BBFILE_PATTERN_meta-own-ros = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-own-ros = "7"

LAYERDEPENDS_meta-own-ros = "core meta-own ros2-jazzy-layer"
LAYERSERIES_COMPAT_meta-own-ros = "scarthgap"
